&quot;use strict&quot;;
const get = id =&gt; document.getElementById(id);
const {run_id, ids, length, frames} = JSON.parse(get(&quot;data&quot;).textContent);
get(&quot;run&quot;).textContent = run_id;
const last = frames.length - 1;
get(&quot;slider&quot;).max = last;
get(&quot;seekN&quot;).max = frames[last].n;
get(&quot;seekT&quot;).max = frames[last].t;
let index = 0, timer = null;
function slots(container, values) {
  get(container).replaceChildren(...values.map(([label, style]) =&gt; {
    const item = document.createElement(&quot;div&quot;);
    item.className = &quot;slot &quot; + style;
    item.textContent = label;
    return item;
  }));
}
function draw(at) {
  index = Math.min(last, Math.max(0, at));
  const f = frames[index];
  slots(&quot;ring&quot;, ids.map((id, i) =&gt; {
    const plus = f.intentions[i] === 1;
    const outside = !Object.hasOwn(f.positions, id);
    return [id + &quot; &quot; + (plus ? &quot;＋&quot; : &quot;−&quot;) + (outside ? &quot;\n退出済&quot; : &quot;&quot;),
      (plus ? &quot;plus&quot; : &quot;minus&quot;) + (outside ? &quot; out&quot; : &quot;&quot;)];
  }));
  const byCell = new Map(Object.entries(f.positions).map(([id, pos]) =&gt; [pos, id]));
  const cells = Array.from({length}, (_, i) =&gt; {
    const id = byCell.get(i + 1);
    return [(i + 1) + &quot;\n&quot; + (id ?? &quot;·&quot;), id ? &quot;occupied&quot; : &quot;&quot;];
  });
  cells.push([f.exit_ids.join(&quot;・&quot;) || &quot;高台\n出口&quot;, &quot;exit&quot;]);
  slots(&quot;road&quot;, cells);
  get(&quot;phase&quot;).textContent = {
    initial: &quot;初期配置&quot;, decision: &quot;意思更新 · 位置固定&quot;, movement: &quot;移動試行 · 位置更新&quot;
  }[f.phase];
  const c = f.counts;

function pause() {
  clearInterval(timer);
  timer = null;
}
get(&quot;play&quot;).onclick = () =&gt; {
  if (timer !== null) return;
  if (index === last) draw(0);
  timer = setInterval(() =&gt; {

    if (index === last) pause();

};
get(&quot;pause&quot;).onclick = pause;
get(&quot;next&quot;).onclick = () =&gt; { pause(); draw(index + 1); };
get(&quot;slider&quot;).oninput = e =&gt; { pause(); draw(Number(e.target.value)); };
get(&quot;seekN&quot;).onchange = e =&gt; {

  const i = frames.findIndex(f =&gt; f.t === Number(e.target.value) &amp;&amp; f.phase !== &quot;decision&quot;);
  draw(i &lt; 0 ? index : i);
};

&lt;script&gt;
&quot;use strict&quot;;
const get = id =&gt; document.getElementById(id);
const {run_id, ids, length, frames} = JSON.parse(get(&quot;data&quot;).textContent);
get(&quot;run&quot;).textContent = run_id;
const last = frames.length - 1;
get(&quot;slider&quot;).max = last;
get(&quot;seekN&quot;).max = frames[last].n;
get(&quot;seekT&quot;).max = frames[last].t;
let index = 0, timer = null;
function slots(container, values) {
  get(container).replaceChildren(...values.map(([label, style]) =&gt; {
    const item = document.createElement(&quot;div&quot;);
    item.className = &quot;slot &quot; + style;
    item.textContent = label;
    return item;
  }));
}
function draw(at) {
  index = Math.min(last, Math.max(0, at));
  const f = frames[index];
  slots(&quot;ring&quot;, ids.map((id, i) =&gt; {
    const plus = f.intentions[i] === 1;
    const outside = !Object.hasOwn(f.positions, id);
    return [id + &quot; &quot; + (plus ? &quot;＋&quot; : &quot;−&quot;) + (outside ? &quot;\n退出済&quot; : &quot;&quot;),
      (plus ? &quot;plus&quot; : &quot;minus&quot;) + (outside ? &quot; out&quot; : &quot;&quot;)];
  }));
  const byCell = new Map(Object.entries(f.positions).map(([id, pos]) =&gt; [pos, id]));
  const cells = Array.from({length}, (_, i) =&gt; {
    const id = byCell.get(i + 1);
    return [(i + 1) + &quot;\n&quot; + (id ?? &quot;·&quot;), id ? &quot;occupied&quot; : &quot;&quot;];
  });
  cells.push([f.exit_ids.join(&quot;・&quot;) || &quot;高台\n出口&quot;, &quot;exit&quot;]);
  slots(&quot;road&quot;, cells);
  get(&quot;phase&quot;).textContent = {
    initial: &quot;初期配置&quot;, decision: &quot;意思更新 · 位置固定&quot;, movement: &quot;移動試行 · 位置更新&quot;
  }[f.phase];
  const c = f.counts;
  get(&quot;stats&quot;).textContent = (c
    ? `意思停止 ${c.intention_stop} ｜ 排他停止 ${c.exclusion_stop} ｜ 実移動 ${c.move}`
    : &quot;意思停止 — ｜ 排他停止 — ｜ 実移動 —&quot;) + ` ｜ 累積退出 ${f.cumulative_exits}`;
  get(&quot;time&quot;).textContent = `n=${f.n} / t=${f.t}`;
  get(&quot;slider&quot;).value = index;
  get(&quot;seekN&quot;).value = f.n;
  get(&quot;seekT&quot;).value = f.t;
}
function pause() {
  clearInterval(timer);
  timer = null;
}
get(&quot;play&quot;).onclick = () =&gt; {
  if (timer !== null) return;
  if (index === last) draw(0);
  timer = setInterval(() =&gt; {
    draw(index + 1);
    if (index === last) pause();
  }, 520);
};
get(&quot;pause&quot;).onclick = pause;
get(&quot;next&quot;).onclick = () =&gt; { pause(); draw(index + 1); };
get(&quot;slider&quot;).oninput = e =&gt; { pause(); draw(Number(e.target.value)); };
get(&quot;seekN&quot;).onchange = e =&gt; {
  pause();
  const i = frames.findIndex(f =&gt; f.n === Number(e.target.value));
  draw(i &lt; 0 ? index : i);
};
get(&quot;seekT&quot;).onchange = e =&gt; {
  pause();
  const i = frames.findIndex(f =&gt; f.t === Number(e.target.value) &amp;&amp; f.phase !== &quot;decision&quot;);
  draw(i &lt; 0 ? index : i);
};
draw(0);

<script>
const at = id => document.getElementById(id);
const panes = [...document.querySelectorAll("iframe")];
const limit = Number(at("slider").max);
let t = 0, timer = null;
function draw(value) {
  t = Math.max(0, Math.min(limit, Math.trunc(value)));
  panes.forEach(pane => pane.contentWindow.draw?.(t));
  at("time").value = at("slider").value = t;
}
function pause() { clearInterval(timer); timer = null; }
panes.forEach(pane => pane.addEventListener("load", () => draw(t)));
at("play").onclick = () => {
  if (timer !== null) return;
  if (t === limit) draw(0);
  timer = setInterval(() => { draw(t + 1); if (t === limit) pause(); }, 320);
};
at("pause").onclick = pause;
at("next").onclick = () => { pause(); draw(t + 1); };
at("time").onchange = e => { pause(); draw(Number(e.target.value)); };
at("slider").oninput = e => { pause(); draw(Number(e.target.value)); };
draw(0);
</script></html>
